invDepth_min_range: 0.2
invDepth_max_range: 2
TS_HISTORY_LENGTH: 100
REF_HISTORY_LENGTH: 10
tracking_rate_hz: 100
patch_size_X: 1
patch_size_Y: 1
kernelSize: 5
MAX_REGISTRATION_POINTS: 2000
BATCH_SIZE: 300
MAX_ITERATION: 10
LSnorm: Huber #Huber #L2, Huber
huber_threshold: 50 #50
MIN_NUM_EVENTS: 1000
RegProblemType: 1 # 0 numerical, 1 analytical
SAVE_TRAJECTORY: True
PATH_TO_SAVE_TRAJECTORY: "/root/esvo2_output/"
VISUALIZE_TRAJECTORY: True
USE_IMU: False
# Gyro rotation prediction (rotation only; translation stays vision-only).
# Needs /imu/data_synced (imu_restamp.py) and a calibrated T_b_c rotation.
IMU_ROTATION_PREDICTION: True
# camera time = IMU time + IMU_TIME_OFFSET (s), from calibrate_imu_camera_rotation.py
IMU_TIME_OFFSET: -0.005
# Rotation from the bias-corrected gyro, translation-only registration (see
# docs/superpowers/specs/2026-09-18-gyro-locked-tracking-design.md). Without it,
# beside a flat wall the solver explains a sideways slide as yaw.
# Gyro bias: estimated from the first still window after start: hold the rig
# still for GYRO_BIAS_WINDOW seconds. Set GYRO_BIAS: [bx, by, bz] (rad/s, IMU
# frame) instead to skip estimation, e.g. for replays that do not start still.
IMU_ROTATION_LOCK: True
GYRO_BIAS_WINDOW: 2.0
GYRO_STILL_MAX_STD: 0.0035
# Hold at rest (docs/superpowers/specs/2026-09-23-realtime-pipeline-findings.md, part F).
# A still event camera sees almost nothing: without this, every stop empties the map and
# resets the system. Events decide first; when they cannot register a frame (map below
# BATCH_SIZE, the smallest eigenvalue of J^T J/N below STILL_MIN_INFO, or under
# STILL_MIN_SUPPORT of the time surface's fresh pixels in clusters of 4+ per 8x8), a fresh and quiet
# IMU (/imu/data_synced: gyro std < GYRO_STILL_MAX_STD and accelerometer std <
# ACC_STILL_MAX_STD over STILL_WINDOW s) holds the last pose instead of resetting. A missing,
# stale or frozen IMU is never still, so without it the tracker resets as upstream does.
STILLNESS_HOLD: True
STILL_WINDOW: 0.5
ACC_STILL_MAX_STD: 0.03
# hallway2 (rotation-locked frames): moving p5 4e5, the few registered still frames 5e4-2.6e5
STILL_MIN_INFO: 100000.0
# fresh pixels in clustered cells: ~0.9 moving, ~0 on a still camera's noise. Also needed
# to leave a hold or a coast, so a chance J^T J crossing on a still camera is not published.
STILL_MIN_SUPPORT: 0.2
HOLD_MAX_S: 120.0
HOLD_MAP_GRACE_S: 1.0
# A frame the events cannot support is never published. With the IMU saying "moving" and a
# quiet time surface (the rig starting to roll shakes the accelerometer ~0.2 s before the
# scene shows anything; a cart being handled), the tracker coasts on the last pose: the
# events see no motion. With an active time surface it coasts for at most HOLD_COAST_S, then
# falls back to upstream.
HOLD_COAST_S: 0.5
# Re-estimate the gyro bias from every GYRO_BIAS_WINDOW-long still window of a hold
# (the bias drifts with temperature over a session). Only for an estimated bias.
# Off: on the 2-minute hallway bags it showed no benefit, and hallway4's return leg
# averaged 0.81 m with it (5 runs) against 0.87 m without (8 runs). Worth revisiting
# on a long session with ground truth, where thermal drift would show.
GYRO_BIAS_REFRESH: False
