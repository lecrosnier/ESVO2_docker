# Configuration for depth estimation
# Widened from the DVXplorer defaults (0.05-0.33 -> depth 3-20m, tuned for a
# 519mm baseline / large-scale use). Our 156mm baseline + close-range desk
# testing needs to accept much nearer depths, or SGM init rejects nearly
# every candidate point before reaching INIT_SGM_DP_NUM_THRESHOLD.
invDepth_min_range: 0.1
invDepth_max_range: 1.0
residual_vis_threshold: 30 #20 #30 #20 #20
residual_vis_threshold_ln: 30
stdVar_vis_threshold: 1 #0.1 #0.2
stdVar_vis_threshold_ln: 1 #0.1 #0.2
age_max_range: 10
age_vis_threshold: 1
# patch size of static BM
patch_size_X: 15 
patch_size_Y: 7 
# patch size of temporal BM
patch_size_X_2: 5
patch_size_Y_2: 31
# EventBM parameters
BM_half_slice_thickness: 0.001
BM_min_disparity: 0
# Must stay divisible by 16 (cv::StereoSGBM requirement). Widened to reach
# closer depths at our narrower baseline -- see invDepth_max_range above.
# This is a real compute-cost tradeoff (SGBM/EBM cost scales with the
# search range): retune down if mapping_rate_hz can't keep up.
BM_max_disparity: 320
BM_step: 3
BM_ZNCC_Threshold: 0.2
BM_bUpDownConfiguration: False
distance_from_last_frame: 0.20
SmoothTimeSurface: True #False

# Configuration for fusion
fusion_radius: 2
FUSION_STRATEGY: CONST_FRAMES #"CONST_POINTS" # "CONST_FRAMES"
maxNumFusionFrames: 5 #40
maxNumFusionFrames_ln: 5
maxNumFusionPoints: 20000 #8000 #3000
LSnorm: Tdist #Tdist #Tdist #Tdist # l2
Tdist_nu: 2.182 #2.1897
Tdist_scale: 17.277 #16.6397
Tdist_stdvar: 59.763 #56.5347
LSnorm_ln: Tdist #Tdist #Tdist #Tdist # l2
Tdist_nu_ln: 2.182
Tdist_scale_ln: 17.277
Tdist_stdvar_ln: 59.763

# Configuration for point sampling
Denoising: False
# 4000 for the live EVK4 rig (was 10000): block matching and the variance
# step scale with it, and at 10000 mapping overruns its 40 ms budget. Measured
# 2026-09-22 on slide4_bias.bag at 1x, lock on, regularization off:
#   10000: cycle  80 ms   6000: 68 ms   4000: 52 ms   2500: 42 ms but tracking
#   reset 162 times (map too sparse). At 4000 a 1 m out-and-back slide recovers
#   63-76% per leg over three runs, matching 0.25x replay with 10000.
PROCESS_EVENT_NUM: 4000 #20000
PROCESS_EVENT_NUM_AA: 4000 #20000
# Static block matching and the static depth solve read float copies of the
# time surfaces and allocate nothing per event (GPU programme step A1, see
# docs/superpowers/specs/2026-09-22-mapping-float-a1-design.md). The float path
# is bit-identical to the double one on the 51 captured cycles. Offline its
# speedup looked marginal (BM 1.30x, ~3.6 ms of a 52 ms cycle), but under
# real-time load mapping is the stage that overruns, and there it matters: at
# 1x the outward leg of the slide recovers 0.97-0.99 m with it on against
# 0.85-0.89 m with it off.
MAPPING_FLOAT: True
x_patches: 8 
y_patches: 6 
select_points_from_AA: True
eta_for_select_points: 0.1

# Configuration for visualization
# Off for the live EVK4 rig: at real time mapping is the bottleneck (cycle
# ~90 ms against a 40 ms budget at ts_rate 25), and regularization is its
# largest single stage (31% of the cycle, 28 ms mean, 72 ms p90) and runs
# serially. Measured 2026-09-22 on slide4_bias.bag replayed at 1x, lock on:
# off, the cycle drops to ~80 ms and a 1 m out-and-back slide recovers 41-45%
# of the true translation (two runs) against 25% with it on.
Regularization: False
RegularizationRadius: 20
RegularizationMinNeighbours: 32
RegularizationMinCloseNeighbours: 32
bVisualizeGlobalPC: False
visualizeGPC_interval: 0.5 #2[second]
NumGPC_added_per_refresh: 10000
visualize_range: 30

# Configuration for mapping system
TS_HISTORY_LENGTH: 100
USE_IMU: False
INIT_SGM_DP_NUM_THRESHOLD: 500
# SGM seeds the map at initialization. At full resolution over the whole
# disparity range it took ~2 s per attempt on this rig (1280x720), so at 1x the
# system needed 25-30 s to initialize and missed the start of a motion. At half
# resolution an attempt takes ~0.1 s and initialization succeeds in two tries;
# the seed is only sampled at event pixels, so the coarser map is enough.
# Mapping receives six full-frame images per cycle. With the default queue of
# 10 at 50 Hz, whenever mapping falls behind it works through a 200 ms backlog
# instead of skipping to the newest frame, and the tracker then registers
# against a map 300-400 ms old, which at 1x leaked a slide's translation into
# the depth direction. 2 keeps the age near 150 ms; 1 starves the approximate
# time sync and is worse than 10.
TS_QUEUE_SIZE: 2
SGM_DOWNSAMPLE: 2
# Mapping's block matching and depth solve thread count (default 4). The laptop
# has 12 cores and mapping is the cycle that overruns: 8 cut block matching from
# ~28 to ~24 ms at 1x.
NUM_THREAD_MAPPING: 8
mapping_rate_hz: 20
large_scale: True